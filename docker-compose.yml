# The app uses one database: DATABASE_URL from .env (e.g. Neon), for host scripts and containers alike.
services:
  # Disposable Postgres for the e2e test suite only (TEST_DATABASE_URL). Not started by
  # `docker compose up`; start it with `docker compose up -d db`.
  db:
    image: postgres:16-alpine
    profiles: ["test-db"]
    environment:
      POSTGRES_USER: ajodesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ajodesk_local_only}
      POSTGRES_DB: ajodesk
    # Bound to localhost only.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajodesk -d ajodesk"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies pending migrations, then exits. The API starts only if it succeeds.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    command: ["npx", "typeorm", "migration:run", "-d", "dist/database/data-source.js"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      API_PORT: 3001
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Calls the API server-side only; the browser never receives an API credential.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3001
      # Plain-HTTP localhost; remove (defaults to Secure cookies) behind HTTPS.
      COOKIE_SECURE: "false"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
